# Zeff's releases: the self-contained bundle (launcher + Node + Zeff, built) for Windows, macOS
# (Apple Silicon and Intel) and Linux, each built on its own platform (native modules), each
# checked by starting it (scripts/smoke-release.mjs). A tag v* publishes them as a GitHub release;
# "Run workflow" builds and checks without publishing (the archives are the run's artifacts).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
          # The oldest supported Ubuntu: the bundle runs on what's newer.
          - { name: linux-x64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, for the version

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            launcher/package-lock.json

      - name: Dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix launcher

      - name: A display for the smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build the bundle
        run: node scripts/dist.mjs --release

      - name: Smoke test (unpack, start, https)
        shell: bash
        run: node scripts/smoke-release.mjs dist/release/Zeff-*

      - uses: actions/upload-artifact@v5
        with:
          name: zeff-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0 # already compressed

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Download

          | System | File | Start |
          | --- | --- | --- |
          | Windows 10/11 | `Zeff-*-windows-x64.zip` | unzip, start `Zeff\Zeff.exe` |
          | macOS, Apple Silicon | `Zeff-*-macos-arm64.zip` | move `Zeff.app` to Applications, open it (see below) |
          | macOS, Intel | `Zeff-*-macos-x64.zip` | same |
          | Ubuntu 22.04+ (x64) | `Zeff-*-linux-x64.tar.gz` | `tar -xzf Zeff-*.tar.gz && Zeff/zeff` |

          No Node or npm needed. The first start offers to set up https://zeff (hosts entry and Zeff's own
          certificate, admin rights). Details for each system: `README.txt` in the archive.

          **macOS:** Zeff.app isn't signed by an Apple developer account. On the first start macOS refuses:
          System Settings → Privacy & Security → "Open Anyway" — or once in Terminal:
          `xattr -dr com.apple.quarantine /Applications/Zeff.app`

          **Updating:** replace the program, keep your data — Windows: `app\data` and `app\knowledge\data`;
          macOS: `~/Library/Application Support/Zeff`; Linux: `~/.local/share/zeff`.

          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Zeff $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
