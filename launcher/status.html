<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Zeff</title>
    <style>
      :root {
        --bg: #fafafa;
        --card: #fff;
        --fg: #1f1f23;
        --muted: #6b6b75;
        --line: #e4e4e9;
        --accent: #6d28d9;
        --ok: #16a34a;
        --warn: #d97706;
        --bad: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --card: #222226;
          --fg: #ececf1;
          --muted: #9a9aa5;
          --line: #34343a;
          --accent: #a78bfa;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
      h1 { font-size: 20px; margin: 0 0 2px; }
      .sub { color: var(--muted); margin: 0 0 16px; }
      a { color: var(--accent); text-decoration: none; cursor: pointer; }
      a:hover { text-decoration: underline; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
      .row { display: flex; align-items: center; gap: 8px; }
      .name { font-weight: 600; flex: 1; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.running, .dot.external { background: var(--ok); }
      .dot.starting, .dot.crashed { background: var(--warn); }
      .dot.notBuilt { background: var(--bad); }
      .meta { color: var(--muted); font-size: 12.5px; margin: 4px 0 10px 17px; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: 17px; }
      button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; }
      .check { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; }
      .ok { color: var(--ok); }
      .no { color: var(--warn); }
      footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
      label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
      h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
      .mode { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
      .mode:first-of-type { border-top: 0; }
      .mode .label { font-weight: 600; }
      .mode .hint, .mode .state { color: var(--muted); font-size: 12.5px; grid-column: 1; }
      .mode .state .dot { display: inline-block; margin-right: 5px; vertical-align: middle; }
      .switch { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
      .switch label { padding: 4px 12px; font-size: 13px; background: var(--bg); gap: 0; }
      .switch input { display: none; }
      .switch label.on { background: var(--accent); color: #fff; }
      .ctr { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
      .ctr:first-of-type { border-top: 0; }
      .ctr .sub2 { grid-column: 2 / span 2; color: var(--muted); font-size: 12px; }
      .badge { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--accent); color: #fff; margin-left: 6px; }
      .empty { color: var(--muted); font-size: 13px; }
      .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 0 14px; }
      .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 14px; font-size: 14px; }
      .tab.on { border-bottom-color: var(--accent); font-weight: 600; }
      [hidden] { display: none !important; }
      .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Zeff</h1>
    <p class="sub"><a id="url"></a></p>
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="status" role="tab">Status</button>
      <button class="tab" data-tab="docker" role="tab">Docker</button>
    </div>
    <section id="tab-status">
    <div id="services"></div>
    <div class="card">
      <div class="row"><span class="name">https</span><button id="setup">Set up…</button></div>
      <div class="meta" id="checks" style="margin-bottom: 0"></div>
    </div>
    </section>
    <section id="tab-docker" hidden>
    <div class="card">
      <h2>Run in</h2>
      <div id="modes"></div>
      <div class="row" style="margin-top: 8px">
        <span class="note" id="modesNote" style="flex: 1; margin: 0">Everything runs on this computer unless you switch it. Applying restarts the launcher (a few seconds).</span>
        <button id="applyModes" disabled>Apply</button>
      </div>
    </div>
    <div class="card">
      <div class="row"><h2 style="flex: 1; margin: 0">Docker</h2><span class="empty" id="dockerState"></span><button id="dockerRefresh">Refresh</button></div>
      <div id="containers" style="margin-top: 8px"></div>
    </div>
    </section>
    <footer>
      <label><input type="checkbox" id="autostart" /> Start with Windows</label>
      <span class="row"><button id="data">Data folder</button><button id="plugins">Plugins folder</button><button id="quit">Quit Zeff</button></span>
    </footer>
    <script src="status.js"></script>
  </body>
</html>
